# CI for files_agent: unit tests, harness gates and two secret scans.
# Everything runs offline: fake server, scripted model, no secrets, no .env.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]   # PRs from forks run too, with a read-only token and no secrets
  workflow_dispatch:

# Least privilege: every job can only read the repo.
permissions:
  contents: read

# A newer push to the same PR cancels the older run.
# Runs on main are never cancelled, so every merge gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Use bash on every OS, so Windows runs the same commands (with pipefail).
defaults:
  run:
    shell: bash

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false   # finish every leg, so we see all failures at once
      matrix:
        os: [ubuntu-24.04, windows-2025]   # the team develops on Windows
        python: ["3.11", "3.14"]           # 3.11 is the floor in pyproject.toml; 3.14 is the newest stable
    env:
      EXPECTED_TASKS: "24"   # change this on purpose when you add or remove a task
    steps:
      # The default shallow clone (1 commit) is enough for the tests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Routing check (scripted model)
        run: python -m harness routes

      - name: Smoke test (3 tasks, then rescore and calibrate)
        run: python -m harness smoke

      - name: Run every task 5 times (fake server, scripted model)
        run: python -m harness run all --target fake --model scripted --set ci

      # "run all" still exits 0 if a task file is deleted or skipped, so check the count.
      - name: Check that all tasks ran and passed
        run: |
          grep -F "**${EXPECTED_TASKS} of ${EXPECTED_TASKS} tasks pass on every run.**" runs/ci/report.md || {
            echo "::error::Expected ${EXPECTED_TASKS} of ${EXPECTED_TASKS} tasks to pass. See runs/ci/report.md."
            exit 1
          }

      - name: Rescore from the run files (must be identical)
        run: python -m harness rescore runs/ci

      - name: Calibrate (every planted fault must be caught)
        run: python -m harness calibrate runs/ci

      - name: Add the score report to the job summary
        if: always()
        run: |
          if [ -f runs/ci/report.md ]; then cat runs/ci/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      # On failure, upload the run sets so you can see what went wrong.
      # The repo is public, so first scan the run files for secrets, and
      # check that every run file is from the fake server (no live data).
      - name: Check the run files before upload
        id: scan-runs
        if: failure()
        run: |
          python scripts/secret_scan.py
          if grep -rL --include='*.jsonl' '"target": "fake"' runs | grep .; then
            echo "::error::Run files that are not from the fake server. Not uploading."
            exit 1
          fi

      - name: Upload the run sets
        if: failure() && steps.scan-runs.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runs-${{ matrix.os }}-py${{ matrix.python }}
          path: runs/   # score.json, report.md and the run files of each set
          retention-days: 14
          if-no-files-found: ignore

  secret-scan:
    name: secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # every commit; the default (1) would scan only the last one
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Scan every commit on every branch
        run: |
          # Fail if the clone is shallow: then the scan would see only 1 commit.
          [ "$(git rev-parse --is-shallow-repository)" = false ] || { echo "::error::Shallow clone. Set fetch-depth: 0."; exit 1; }
          python scripts/secret_scan.py --history

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from gitleaks_8.30.1_checksums.txt.
      # Change the version and the hash together.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks needs the whole history
          persist-credentials: false

      # This job needs .gitleaks.toml (added in PR #8). Without that file, gitleaks
      # uses only its default rules, finds the 5 known false positives and fails.
      # That is on purpose: deleting the file can never switch the scan off.
      - name: Install gitleaks (pinned version, SHA-256 checked)
        run: |
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball"             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      # Scans every commit on every fetched branch, with the repo's .gitleaks.toml.
      # Reviewed exceptions go only in .gitleaks.toml: inline "gitleaks:allow"
      # comments and a .gitleaksignore file are not accepted.
      # --redact hides secret values. --no-color prints no extra line context.
      - name: Scan every commit with the repo's .gitleaks.toml
        run: |
          [ "$(git rev-parse --is-shallow-repository)" = false ] || { echo "::error::Shallow clone. Set fetch-depth: 0."; exit 1; }
          if [ -e .gitleaksignore ]; then
            echo "::error::.gitleaksignore is not used here. Put reviewed exceptions in .gitleaks.toml."
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --ignore-gitleaks-allow             --redact --no-banner --no-color --verbose --exit-code 1
