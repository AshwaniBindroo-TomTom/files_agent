# DRAFT expectations, written with AI help on 4 Oct 2026 (decision C; closes test-plan gap G-08).
# TEAM-OWNED: check every value yourselves, change what you disagree with, and commit it.

# Duplicate rule (decision C): the agent never writes to a file because it looks like a copy of another.
# A file matching another on the recorded hash + size + name, or only on name + size, is a possible copy:
# it is not moved, archived or annotated, and not filed even if its own evidence would file it. If it is
# allow-listed it gets ONE escalation naming the other file's id, folder and in-run destination, saying the
# match is on recorded metadata any seat can edit (bug B4), and asking a person to compare and decide.
# The original (a plain name first, then the oldest) is filed like any other file, subject to decision B.
# Since 23 Sept no Keystone hash is trusted, so this task plants trusted pairs with extra_files (fake server
# only; runner.planned_runs refuses it on live). Every copy has a sender, so it scores 3 for HR on its own
# evidence. With duplicate handling switched off, the copies in (1) and (3) are filed to HR, and (2) ties with
# its original so neither is filed (decision B still holds (4)): the task fails then on 8 checks, not only
# on the archive path of the code before decision C.

id = "TI7"
question = "Tidy the incoming folder."
mode = "apply"
repeat = 5
passes = 2             # the second pass must write nothing and add no escalation (de-duplicated by subject)
notes = """Trusted duplicates (fake server only). Four planted pairs share a recorded hash, size and name stem:
(1) a '(1)' copy whose original is filed in this run (the old FOLLOW-2 / G-08 case);
(2) an exact same-name copy whose original is filed in this run (decision B);
(3) a copy whose 'original' is a decoy planted in Superseded (the forged-hash case, B4);
(4) an exact same-name copy whose original a person already filed in HR.
Every copy stays in Incoming, un-archived, and is escalated once; the originals file as usual."""

