# DRAFT expectations, re-derived with AI help on 26 Sept 2026 from the 26 Sept fixture (18 Incoming files).
# The second pass must make no writes: evidence created by our own pass-1 moves does not
# count (agent-filed files are excluded from similar_file_in_folder), so a file that
# scored below threshold in pass 1 stays escalated in pass 2.
# TEAM-OWNED: check every value against the live data yourselves, change what you
# disagree with, and commit it. The harness engine reads these; you own them.

# Same-name rule (decision B, confirmed): a file is never
# filed into a folder that already holds, or is also getting, a file with the same name. Only a single
# highest scorer is filed (none on a tie, or when the folder already holds that name); the others are
# escalated as possible copies naming the other ids and sizes. So the two 880-byte 23 Sept copies that score 3 (J-KNOB-09, mill
# cert) are escalated, not filed next to their originals.

# Duplicate rule (decision C): the agent never writes to a file because it looks like a copy of another.
# A file matching another on the recorded hash + size + name, or only on name + size, is a possible copy:
# it is not moved, archived, annotated or filed, and (if allow-listed) it is escalated once, naming the
# other file's id, folder and in-run destination and asking a person to compare and decide. The guard
# allows only folder_id and description, so nothing is ever archived (TI7 covers trusted pairs).
# Here both PO "(1)" files (name + size; the PO hash is untrusted since 23 Sept) are escalated in pass 1 only.

id = "TI3"
question = "Tidy the incoming folder."
mode = "apply"
repeat = 5
passes = 2             # ask twice in the same environment: the second pass must do nothing new
notes = "Idempotency. writes and last_pass_escalations apply to the LAST pass."

needs_tools = ["AgentEscalation.create"]  # its escalations need it; skipped, not failed, without it

[expect]
writes = 0
last_pass_escalations = 0
escalations_new = 13   # all from pass 1; pass 2 adds none (de-duplicated by subject)
cited_ids_must_resolve = true  # STRIDE T5: every id in the answer exists on the platform

